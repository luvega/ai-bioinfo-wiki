
    <style>
        .output.text_html {
            --pst-color-text-base: transparent !important;
        }
        .mcq-box {
            border: none !important;
            box-shadow: none !important;
            outline: none !important;
            padding: 12px;
            width: 340px;
            text-align: left;
            font-size: 15px;
            margin-bottom: 8px;
            background-color: #3965a3;
            border-radius: 8px;
            color: white;
        }
    </style>

    <div class="mcq-box">
        <p><strong>You have an 80 GB AnnData object and a 40 GB GPU. Which RMM configuration is appropriate?</strong></p>
        
        <label style="color: white;">
            <input type="radio" name="qq1" value="pool_allocator=True, managed_memory=False"
            onclick="checkAnswer(this, 'pool_allocator=False, managed_memory=True', 'A pool allocator caps you at VRAM size. The dataset doesn't fit.', 'feedback-q1')"> pool_allocator=True, managed_memory=False
        </label><br>
        
        <label style="color: white;">
            <input type="radio" name="qq1" value="pool_allocator=False, managed_memory=True"
            onclick="checkAnswer(this, 'pool_allocator=False, managed_memory=True', '', 'feedback-q1')"> pool_allocator=False, managed_memory=True
        </label><br>
        
        <label style="color: white;">
            <input type="radio" name="qq1" value="pool_allocator=True, managed_memory=True"
            onclick="checkAnswer(this, 'pool_allocator=False, managed_memory=True', 'Mixing the two strategies fragments memory and erodes the speedup.', 'feedback-q1')"> pool_allocator=True, managed_memory=True
        </label><br>
        
        <label style="color: white;">
            <input type="radio" name="qq1" value="Don't reinitialize RMM; let the default allocator handle it"
            onclick="checkAnswer(this, 'pool_allocator=False, managed_memory=True', 'The default plain-cudaMalloc allocator works but pays an allocation cost on every temporary array.', 'feedback-q1')"> Don't reinitialize RMM; let the default allocator handle it
        </label><br>
        
        <p id="feedback-q1" style="font-weight: bold;"></p>
        <p class="mcq-answer-q1" style="display: none; font-weight: bold; color: red;">
            ✔ Correct Answer: pool_allocator=False, managed_memory=True
        </p>
    </div>

    <script>
    function checkAnswer(element, correct, explanation, feedbackId) {
        let feedback = document.getElementById(feedbackId);
        if (element.value === correct) {
            feedback.innerHTML = "✅ Correct!";
            feedback.style.color = "#a8d480";
        } else {
            feedback.innerHTML = "❌ Incorrect! " + explanation;
            feedback.style.color = "#EE4B2B";
        }
    }
    </script>
