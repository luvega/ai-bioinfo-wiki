
    <style>
        .output.text_html {
            --pst-color-text-base: transparent !important;
        }
        .mcq-box {
            border: none !important;
            box-shadow: none !important;
            outline: none !important;
            padding: 12px;
            width: 340px;
            text-align: left;
            font-size: 15px;
            margin-bottom: 8px;
            background-color: #3965a3;
            border-radius: 8px;
            color: white;
        }
    </style>

    <div class="mcq-box">
        <p><strong>What does a positive log2 fold change indicate in DESeq2 results?</strong></p>
        
        <label style="color: white;">
            <input type="radio" name="qq4" value="The gene is expressed equally in both groups"
            onclick="checkAnswer(this, 'The gene is more expressed in the group of interest compared to baseline', '', 'feedback-q4')"> The gene is expressed equally in both groups
        </label><br>
        
        <label style="color: white;">
            <input type="radio" name="qq4" value="The gene is more expressed in the baseline group"
            onclick="checkAnswer(this, 'The gene is more expressed in the group of interest compared to baseline', '', 'feedback-q4')"> The gene is more expressed in the baseline group
        </label><br>
        
        <label style="color: white;">
            <input type="radio" name="qq4" value="The gene is more expressed in the group of interest compared to baseline"
            onclick="checkAnswer(this, 'The gene is more expressed in the group of interest compared to baseline', '', 'feedback-q4')"> The gene is more expressed in the group of interest compared to baseline
        </label><br>
        
        <label style="color: white;">
            <input type="radio" name="qq4" value="The gene was filtered out during preprocessing"
            onclick="checkAnswer(this, 'The gene is more expressed in the group of interest compared to baseline', '', 'feedback-q4')"> The gene was filtered out during preprocessing
        </label><br>
        
        <p id="feedback-q4" style="font-weight: bold;"></p>
        <p class="mcq-answer-q4" style="display: none; font-weight: bold; color: red;">
            ✔ Correct Answer: The gene is more expressed in the group of interest compared to baseline
        </p>
    </div>

    <script>
    function checkAnswer(element, correct, explanation, feedbackId) {
        let feedback = document.getElementById(feedbackId);
        if (element.value === correct) {
            feedback.innerHTML = "✅ Correct!";
            feedback.style.color = "#a8d480";
        } else {
            feedback.innerHTML = "❌ Incorrect! " + explanation;
            feedback.style.color = "#EE4B2B";
        }
    }
    </script>
