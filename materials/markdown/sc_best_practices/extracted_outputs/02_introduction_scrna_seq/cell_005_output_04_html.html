
    <style>
        .output.text_html {
            --pst-color-text-base: transparent !important;
        }
        .mcq-box {
            border: none !important;
            box-shadow: none !important;
            outline: none !important;
            padding: 15px;
            width: 400px;
            text-align: left;
            font-size: 18px;
            margin-bottom: 10px;
            background-color: #3965a3;
            border-radius: 10px;
            color: white;
        }
    </style>

    <div class="mcq-box">
        <p><strong>Which of the following best describes PIP-seq?</strong></p>
        
        <label style="color: white;">
            <input type="radio" name="qq4" value="A protocol using microfluidics"
            onclick="checkAnswer(this, 'A simplified droplet-based method using vortexing', '', 'feedback-q4')"> A protocol using microfluidics
        </label><br>
        
        <label style="color: white;">
            <input type="radio" name="qq4" value="A plate-based protocol"
            onclick="checkAnswer(this, 'A simplified droplet-based method using vortexing', '', 'feedback-q4')"> A plate-based protocol
        </label><br>
        
        <label style="color: white;">
            <input type="radio" name="qq4" value="A simplified droplet-based method using vortexing"
            onclick="checkAnswer(this, 'A simplified droplet-based method using vortexing', '', 'feedback-q4')"> A simplified droplet-based method using vortexing
        </label><br>
        
        <label style="color: white;">
            <input type="radio" name="qq4" value="A long-read sequencing method"
            onclick="checkAnswer(this, 'A simplified droplet-based method using vortexing', '', 'feedback-q4')"> A long-read sequencing method
        </label><br>
        
        <p id="feedback-q4" style="font-weight: bold;"></p>
        <p class="mcq-answer-q4" style="display: none; font-weight: bold; color: red;">
            ✔ Correct Answer: A simplified droplet-based method using vortexing
        </p>
    </div>

    <script>
    function checkAnswer(element, correct, explanation, feedbackId) {
        let feedback = document.getElementById(feedbackId);
        if (element.value === correct) {
            feedback.innerHTML = "✅ Correct!";
            feedback.style.color = "#a8d480";
        } else {
            feedback.innerHTML = "❌ Incorrect! " + explanation;
            feedback.style.color = "#EE4B2B";
        }
    }
    </script>
